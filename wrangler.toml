name = "proof-of-concept-v3"
main = "worker.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "proof_commons_db"
database_id = "4cb9abc0-eac2-4b22-bd8b-c89ff9d87a6b"

# Stage 2: Semantic Idea Proximity (Workers AI + D1 vector cache)
# Uses @cf/baai/bge-base-en-v1.5 (768 dims) and stores vectors in D1 `idea_vectors`.
[ai]
binding = "AI"

# Optional scale-up: uncomment [[vectorize]] only after creating the index via Wrangler CLI:
#   npx wrangler vectorize create proof-commons-ideas --dimensions=768 --metric=cosine
#
# [[vectorize]]
# binding = "VECTORIZE"
# index_name = "proof-commons-ideas"
